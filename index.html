<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carte de visite numérique – Médecin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f4ef;--card:#ffffff;--ink:#14232a;--muted:#66757c;--faint:#97a3a8;--line:#e8e3d9;--soft:#f1eee7;
  --h1:#1a5560;--h2:#0c2f36;--gold:#b08d57;--al:#e0c898;--glow:rgba(176,141,87,.33);
  --shadow:0 1px 2px rgba(16,35,42,.04),0 10px 30px -12px rgba(16,35,42,.14);
  --r:22px;color-scheme:light;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1519;--card:#111f25;--ink:#ece7dc;--muted:#97a6ac;--faint:#6f8087;--line:#1f333b;--soft:#16272e;--shadow:0 1px 2px rgba(0,0,0,.2),0 14px 34px -14px rgba(0,0,0,.55);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1519;--card:#111f25;--ink:#ece7dc;--muted:#97a6ac;--faint:#6f8087;--line:#1f333b;--soft:#16272e;--shadow:0 1px 2px rgba(0,0,0,.2),0 14px 34px -14px rgba(0,0,0,.55);color-scheme:dark}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased;font-weight:400;padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:520px;margin:0 auto;padding:0 18px 120px;background:var(--bg);position:relative}
a{color:inherit}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- En-tête ---------- */
.hero{position:relative;margin:0 -18px;padding:calc(56px + env(safe-area-inset-top,0px)) 24px 128px;text-align:center;color:#f4eee2;overflow:hidden;
  background:radial-gradient(90% 70% at 50% 0%,var(--glow),transparent 65%),linear-gradient(168deg,var(--h1),var(--h2) 78%)}
.hero:before{content:"";position:absolute;left:50%;top:-140px;width:620px;height:620px;transform:translateX(-50%);border-radius:50%;
  background:repeating-radial-gradient(circle,rgba(255,255,255,.07) 0 1px,transparent 1px 44px);-webkit-mask:radial-gradient(circle,#000 30%,transparent 70%);mask:radial-gradient(circle,#000 30%,transparent 70%);pointer-events:none}
.hero > *{position:relative}
.avatar-ring{width:136px;height:136px;margin:0 auto 22px;border-radius:50%;padding:4px;background:conic-gradient(from 210deg,var(--al),var(--gold),rgba(255,255,255,.15),var(--al));box-shadow:0 18px 40px rgba(0,0,0,.32)}
.avatar{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;border:3px solid var(--h2);background:var(--h2)}
.badge-pro{display:inline-flex;align-items:center;gap:7px;padding:6px 13px;border-radius:999px;font-size:.7rem;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--al);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);margin-bottom:14px}
.badge-pro i{width:6px;height:6px;border-radius:50%;background:var(--al);box-shadow:0 0 0 3px rgba(255,255,255,.12)}
h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:2.45rem;line-height:1.05;letter-spacing:.005em}
.hero .sub{color:rgba(244,238,226,.74);margin-top:12px;font-weight:300;font-size:.98rem}
.hero .clinic{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-size:.84rem;color:rgba(244,238,226,.6)}
.hero .clinic svg{width:15px;height:15px}
.ecg{position:absolute!important;left:0;right:0;bottom:66px;display:block;width:100%;height:40px;opacity:.85}
.ecg path{fill:none;stroke:var(--al);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:100;animation:ecg 3.6s ease-in-out infinite}
@keyframes ecg{0%{stroke-dashoffset:100;opacity:1}60%{stroke-dashoffset:0;opacity:1}90%{stroke-dashoffset:0;opacity:0}100%{stroke-dashoffset:100;opacity:0}}

/* ---------- Actions (remontent sur l'en-tête) ---------- */
.actions{position:relative;z-index:2;margin-top:-56px;display:grid;gap:12px}
.qa{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.qa a{display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 6px 16px;text-decoration:none;font-size:.8rem;font-weight:500;color:var(--ink);transition:background .2s}
.qa a + a{border-left:1px solid var(--line)}
.qa a:active{background:var(--soft)}
.qa i{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:var(--gold);background:color-mix(in srgb,var(--gold) 12%,transparent)}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;padding:16px 18px;border-radius:16px;background:var(--card);color:var(--ink);text-decoration:none;font-weight:500;font-size:.95rem;border:1px solid var(--line);cursor:pointer;font-family:inherit;transition:transform .2s}
.btn:active{transform:scale(.98)}
.btn svg{color:var(--gold)}
.btn.primary{background:linear-gradient(135deg,var(--h1),var(--h2));color:#f6efe0;border:0;box-shadow:0 14px 28px -10px color-mix(in srgb,var(--h2) 70%,transparent);padding:18px;font-size:1rem}
.btn.primary svg{color:var(--al)}
.btn.ghost{background:transparent;border:1px solid color-mix(in srgb,var(--gold) 55%,transparent)}

/* ---------- Chiffres clés ---------- */
.stats{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:20px 4px}
.stat{text-align:center;padding:0 6px}
.stat + .stat{border-left:1px solid var(--line)}
.stat b{display:block;font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:1.95rem;line-height:1;color:var(--gold);letter-spacing:-.01em}
.stat small{display:block;margin-top:8px;color:var(--muted);font-size:.72rem;line-height:1.35;letter-spacing:.02em}
.stat .bar{height:3px;width:46px;margin:12px auto 0;border-radius:3px;background:var(--soft);overflow:hidden}
.stat .bar i{display:block;height:100%;width:var(--p);background:linear-gradient(90deg,var(--gold),var(--al));border-radius:3px;animation:grow 1.2s ease-out}
@keyframes grow{from{width:0}}

/* ---------- Cartes ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:24px 22px;margin-top:16px}
h2{display:flex;align-items:center;gap:12px;margin-bottom:16px;font-family:"Cormorant Garamond",Georgia,serif;font-size:1.5rem;font-weight:600;line-height:1.2}
h2 .hi{flex:none;width:34px;height:34px;border-radius:11px;display:grid;place-items:center;color:var(--gold);background:color-mix(in srgb,var(--gold) 12%,transparent)}
h2 .hi svg{width:17px;height:17px}
h2:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.card p{color:var(--muted);font-weight:400;font-size:.95rem;line-height:1.7}
.bio{position:relative}
.bio.clamp p{display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.more-btn{margin-top:10px;padding:0;border:0;background:none;font:inherit;font-size:.85rem;font-weight:600;color:var(--gold);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.more-btn svg{width:15px;height:15px;transition:transform .25s}
.open .more-btn svg{transform:rotate(180deg)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:18px}
.fact{padding:12px 14px;border-radius:14px;background:var(--soft);border:1px solid var(--line);font-weight:500;font-size:.9rem;line-height:1.35}
.fact small{display:block;margin-bottom:3px;color:var(--gold);font-size:.64rem;font-weight:600;text-transform:uppercase;letter-spacing:.16em}

.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:12px;font-size:.86rem;font-weight:500;line-height:1.3;color:var(--ink);background:var(--soft);border:1px solid var(--line)}
.tag:before{content:"";flex:none;width:6px;height:6px;border-radius:50%;background:var(--gold)}

.tl{position:relative;padding-left:26px}
.tl:before{content:"";position:absolute;left:5px;top:10px;bottom:10px;width:1.5px;background:linear-gradient(var(--gold),var(--line))}
.ti{position:relative;padding-bottom:18px;font-size:.93rem;line-height:1.5}
.ti:last-child{padding-bottom:0}
.ti:before{content:"";position:absolute;left:-26px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--card);border:2px solid var(--gold)}
.ti:last-of-type:before{background:var(--gold);box-shadow:0 0 0 4px color-mix(in srgb,var(--gold) 20%,transparent)}
.ti small{display:inline-block;margin-bottom:3px;padding:2px 9px;border-radius:999px;font-size:.72rem;font-weight:600;letter-spacing:.06em;color:var(--gold);background:color-mix(in srgb,var(--gold) 11%,transparent)}
.tl .ti.extra{display:none}
.tl.open .ti.extra{display:block}

.row{display:flex;gap:14px;align-items:center;padding:13px 0;border-top:1px solid var(--line);text-decoration:none;color:inherit}
.row:first-of-type{border-top:0;padding-top:2px}
.ico{flex:none;width:42px;height:42px;border-radius:13px;display:grid;place-items:center;color:var(--gold);background:color-mix(in srgb,var(--gold) 11%,transparent)}
.ico svg{width:18px;height:18px}
.row small{display:block;color:var(--faint);font-size:.66rem;font-weight:600;text-transform:uppercase;letter-spacing:.14em}
.row span{font-weight:500;overflow-wrap:anywhere}
.row .go{margin-left:auto;color:var(--faint)}
.row .go svg{width:16px;height:16px}

.pill{display:inline-flex;align-items:center;gap:8px;margin:-4px 0 14px;padding:6px 12px;border-radius:999px;font-size:.78rem;font-weight:600;background:color-mix(in srgb,#d64545 12%,transparent);color:#c13d3d}
.pill:before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.on{background:color-mix(in srgb,#2f9e5e 14%,transparent);color:#24834c}
.pill.on:before{animation:pulse 1.8s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(47,158,94,.5)}100%{box-shadow:0 0 0 8px rgba(47,158,94,0)}}
.wd{display:grid;grid-template-columns:38px 1fr 82px;gap:10px;align-items:center;padding:7px 8px;margin:0 -8px;border-radius:10px;font-size:.85rem}
.dn{color:var(--muted)}.ht{text-align:right;font-weight:500;font-variant-numeric:tabular-nums}
.ht.off{color:var(--faint);font-weight:400}
.today{background:color-mix(in srgb,var(--gold) 9%,transparent)}
.today .dn{color:var(--gold);font-weight:700}
.track{height:8px;border-radius:6px;background:var(--soft);position:relative;overflow:hidden}
.track i{position:absolute;top:0;bottom:0;border-radius:6px;background:linear-gradient(90deg,var(--gold),var(--al))}
.axis{display:flex;justify-content:space-between;margin:4px 82px 0 48px;font-size:.66rem;color:var(--faint)}

.map{height:160px;border-radius:16px;margin-bottom:14px;position:relative;overflow:hidden;display:grid;place-items:center;border:1px solid var(--line);
  background:radial-gradient(circle at 50% 50%,color-mix(in srgb,var(--gold) 16%,transparent),transparent 55%),var(--soft)}
.map:before{content:"";position:absolute;inset:0;opacity:.9;background:
  linear-gradient(28deg,transparent 46%,var(--card) 46% 50%,transparent 50%),
  linear-gradient(-62deg,transparent 58%,var(--card) 58% 61%,transparent 61%),
  repeating-linear-gradient(0deg,transparent 0 26px,var(--line) 26px 27px),repeating-linear-gradient(90deg,transparent 0 34px,var(--line) 34px 35px)}
.pin{position:relative;z-index:1;width:38px;height:38px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:linear-gradient(135deg,var(--al),var(--gold));box-shadow:0 10px 18px color-mix(in srgb,var(--gold) 45%,transparent);animation:b 2.4s ease-in-out infinite}
.pin:after{content:"";position:absolute;inset:12px;border-radius:50%;background:#fff}
@keyframes b{50%{transform:rotate(-45deg) translate(3px,-3px)}}
.addr{display:flex;gap:10px;align-items:flex-start;margin-bottom:14px;color:var(--muted);font-size:.92rem;line-height:1.5}
.addr b{display:block;color:var(--ink);font-weight:600}

.social{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.chip{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--soft);text-decoration:none;font-weight:500;font-size:.9rem}
.chip svg{width:18px;height:18px;color:var(--gold)}

.qr{display:grid;place-items:center;gap:14px;text-align:center;color:var(--muted);font-size:.86rem}
.qr h2{width:100%;margin:0}
#qr{padding:14px;background:#fff;border-radius:18px;border:1px solid var(--line);min-height:150px;min-width:150px;display:grid;place-items:center;box-shadow:var(--shadow)}

footer{text-align:center;margin-top:34px;color:var(--faint);font-size:.7rem;letter-spacing:.2em;text-transform:uppercase}
footer b{display:block;font-family:"Cormorant Garamond",serif;color:var(--ink);font-size:1.45rem;letter-spacing:.06em;text-transform:none;margin-bottom:2px}
.demo{margin-top:16px;font-size:.72rem;letter-spacing:.04em;text-transform:none}
.dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--card);box-shadow:0 0 0 1px var(--line);margin:0 4px;cursor:pointer}

/* ---------- Barre d'actions fixe (apparaît en faisant défiler) ---------- */
.dock{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:20;transform:translate(-50%,140%);display:flex;gap:6px;padding:6px;border-radius:22px;
  background:color-mix(in srgb,var(--card) 82%,transparent);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);border:1px solid var(--line);box-shadow:0 18px 40px -12px rgba(10,30,36,.35);transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.dock.show{transform:translate(-50%,0)}
.dock a{display:flex;align-items:center;gap:8px;padding:12px 16px;border-radius:16px;text-decoration:none;font-size:.86rem;font-weight:600;white-space:nowrap;color:var(--ink)}
.dock a svg{width:18px;height:18px;color:var(--gold)}
.dock a.main{background:linear-gradient(135deg,var(--h1),var(--h2));color:#f6efe0}
.dock a.main svg{color:var(--al)}

.fade{opacity:0;transform:translateY(12px);animation:f .7s ease forwards}
@keyframes f{to{opacity:1;transform:none}}
.d1{animation-delay:.1s}.d2{animation-delay:.2s}.d3{animation-delay:.3s}
@media (min-width:700px){body{padding:28px 0;background:linear-gradient(160deg,#e9e3d6,#d9e4e3)}.wrap{border-radius:40px;overflow:hidden;box-shadow:0 30px 70px rgba(12,47,54,.22)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.fade{opacity:1;transform:none}.ecg path{stroke-dashoffset:0!important;opacity:1!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="/config.js"></script>
<script>
/* ====================================================================
   🔒 MOTEUR MULTI-MÉDECINS — NE RIEN MODIFIER CI-DESSOUS
   (les données viennent de /config.js)
   ==================================================================== */
const THEMES = {
  or:       { h1:"#1a5560", h2:"#0c2f36", a:"#b08d57", al:"#e0c898" },
  ocean:    { h1:"#1f64a0", h2:"#0b2c4f", a:"#2f8fcb", al:"#bfe3f7" },
  emeraude: { h1:"#1c7059", h2:"#0b3a30", a:"#2a9f7a", al:"#bdeedc" },
  royal:    { h1:"#5640a8", h2:"#241a52", a:"#7d62d6", al:"#d9cffa" },
  rose:     { h1:"#a8426a", h2:"#4a1428", a:"#cc5a80", al:"#fbd3df" }
};
let TH, themeOverride = null;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const digits = s => String(s ?? "").replace(/[^\d]/g, "");
const has = v => v !== undefined && v !== null && String(v).trim() !== "";
const I = {
  phone:'<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/>',
  chat:'<path d="M21 12a8 8 0 0 1-11.7 7L4 20l1.1-4.2A8 8 0 1 1 21 12z"/>',
  cal:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/>',
  pin:'<path d="M12 21s7-6.2 7-11.5a7 7 0 0 0-14 0C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>',
  mail:'<rect x="3" y="5" width="18" height="14" rx="3"/><path d="m3 7 9 6 9-6"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
  link:'<path d="M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/>',
  about:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>',
  star:'<path d="M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.6 6.6 19.5l1.2-6L3.3 9.3l6.1-.7z"/>',
  path:'<path d="M4 20V10a4 4 0 0 1 4-4h8"/><path d="M13 3l3 3-3 3"/><circle cx="4" cy="20" r="1.5"/>',
  share:'<path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7M16 6l-4-4-4 4M12 2v14"/>',
  chev:'<path d="M6 9l6 6 6-6"/>',
  arrow:'<path d="M9 6l6 6-6 6"/>',
  instagram:'<rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".8"/>',
  facebook:'<path d="M15 3h-2.5A3.5 3.5 0 0 0 9 6.5V9H6.5v3.5H9V21h3.5v-8.5H15l.5-3.5h-3V7a1 1 0 0 1 1-1H15z"/>',
  linkedin:'<rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 10v7M8 7v.01M12 17v-4a2.5 2.5 0 0 1 5 0v4M12 10v7"/>',
  globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>'
};
const svg = k => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${I[k]}</svg>`;
const DAYS = ["lun","mar","mer","jeu","ven","sam","dim"], DAY_LABELS = ["Lun","Mar","Mer","Jeu","Ven","Sam","Dim"];
const CAREER_VISIBLE = 4;   // étapes de parcours visibles avant « Voir tout »

function parseHours(str){
  const m = String(str || "").match(/^\s*(\d{1,2})(?:[:h](\d{2})?)?\s*[-–]\s*(\d{1,2})(?:[:h](\d{2})?)?\s*$/);
  return m ? [ +m[1] + (+m[2] || 0)/60, +m[3] + (+m[4] || 0)/60 ] : null;
}
const fmtH = x => { const h = Math.floor(x), mi = Math.round((x - h) * 60); return mi ? `${h}h${String(mi).padStart(2,"0")}` : `${h}h`; };
// Affichage lisible d'un numéro marocain : +212535526677 → +212 5 35 52 66 77 (le lien reste inchangé)
function fmtPhone(p){
  const d = digits(p);
  if (/^212\d{9}$/.test(d)) { const n = d.slice(3); return `+212 ${n[0]} ${n.slice(1,3)} ${n.slice(3,5)} ${n.slice(5,7)} ${n.slice(7,9)}`; }
  if (/^0\d{9}$/.test(d)) return d.replace(/(\d{2})(?=\d)/g, "$1 ");
  return String(p || "");
}

function fallbackAvatar(d){
  const ini = ((d.firstName || "?")[0] + (d.lastName || "")[0]).toUpperCase();
  const sv = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${TH.h1}"/><stop offset="1" stop-color="${TH.h2}"/></linearGradient></defs><rect width="120" height="120" fill="url(#g)"/><text x="60" y="73" font-family="Georgia,serif" font-size="44" fill="${TH.al}" text-anchor="middle">${ini}</text></svg>`;
  return "data:image/svg+xml;utf8," + encodeURIComponent(sv);
}

function vcard(d, full){
  const f = x => String(x || "").replace(/[\n,;]/g, " ");
  const L = ["BEGIN:VCARD","VERSION:3.0", `N:${f(d.lastName)};${f(d.firstName)};;${f(d.title)};`, `FN:${f(full)}`];
  if (has(d.specialty)) L.push(`TITLE:${f(d.specialty)}`);
  if (has(d.clinic))    L.push(`ORG:${f(d.clinic)}`);
  if (has(d.phone))     L.push(`TEL;TYPE=CELL:${d.phone}`);
  if (has(d.email))     L.push(`EMAIL;TYPE=WORK:${d.email}`);
  if (has(d.address))   L.push(`ADR;TYPE=WORK:;;${f(d.address)};;;;`);
  const url = has(d.website) ? d.website : d.profileUrl;
  if (has(url)) L.push(`URL:${url}`);
  L.push("END:VCARD");
  return L.join("\r\n");
}

function render(d){
  TH = THEMES[themeOverride || d.theme] || THEMES.or;
  const rs = document.documentElement.style;
  rs.setProperty("--h1",TH.h1); rs.setProperty("--h2",TH.h2); rs.setProperty("--gold",TH.a); rs.setProperty("--al",TH.al); rs.setProperty("--glow",TH.a+"55");

  const full = [d.title, d.firstName, d.lastName].filter(has).join(" ");
  const fb = fallbackAvatar(d), img = has(d.photo) ? asset(d.photo) : fb;
  const pic = (cls, alt) => `<img${cls ? ` class="${cls}"` : ""} src="${esc(img)}" data-fb="${esc(fb)}" onerror="this.onerror=null;this.src=this.dataset.fb" alt="${esc(alt)}">`;
  document.title = `${full} – ${d.specialty || ""}`;
  { let l = document.querySelector('link[rel="canonical"]'); if (!l) { l = document.createElement("link"); l.rel = "canonical"; document.head.appendChild(l); } l.href = profileUrl(d); }

  const dir = has(d.mapsUrl) ? d.mapsUrl : has(d.address) ? "https://www.google.com/maps/dir/?api=1&destination=" + encodeURIComponent(d.address) : "";
  const row = (ic, label, val, href, shown) => !has(val) ? "" : `<${href?`a href="${esc(href)}"`:"div"} class="row"><div class="ico">${svg(ic)}</div><div><small>${label}</small><span>${esc(shown || val)}</span></div>${href?`<span class="go">${svg("arrow")}</span>`:""}</${href?"a":"div"}>`;
  const head = (ic, t) => `<h2><span class="hi">${svg(ic)}</span>${t}</h2>`;

  // --- Boutons d'action (chacun n'apparaît que si la donnée existe)
  const tiles = [
    has(d.phone)    && `<a href="tel:${esc(d.phone)}"><i>${svg("phone")}</i>Appeler</a>`,
    has(d.whatsapp) && `<a href="https://wa.me/${digits(d.whatsapp)}" target="_blank" rel="noopener"><i>${svg("chat")}</i>WhatsApp</a>`,
    has(dir)        && `<a href="${esc(dir)}" target="_blank" rel="noopener"><i>${svg("pin")}</i>Itinéraire</a>`
  ].filter(Boolean).join("");
  const appt = has(d.appointmentUrl) ? `<a class="btn primary" href="${esc(d.appointmentUrl)}" target="_blank" rel="noopener">${svg("cal")}Prendre rendez-vous</a>` : "";

  // --- Barre fixe : rendez-vous (ou appel) + WhatsApp / itinéraire
  const dockItems = [
    has(d.appointmentUrl) ? `<a class="main" href="${esc(d.appointmentUrl)}" target="_blank" rel="noopener">${svg("cal")}Rendez-vous</a>`
      : has(d.phone) ? `<a class="main" href="tel:${esc(d.phone)}">${svg("phone")}Appeler</a>` : "",
    has(d.whatsapp) ? `<a href="https://wa.me/${digits(d.whatsapp)}" target="_blank" rel="noopener">${svg("chat")}WhatsApp</a>` : "",
    has(dir) ? `<a href="${esc(dir)}" target="_blank" rel="noopener">${svg("pin")}Itinéraire</a>` : ""
  ].filter(Boolean).join("");

  // --- Chiffres clés, expertise, parcours
  const stats = (d.stats || []).map(x => `<div class="stat"><b>${esc(x.v)}</b><small>${esc(x.l)}</small><div class="bar"><i style="--p:${Math.max(0,Math.min(100,+x.p||0))}%"></i></div></div>`).join("");
  const tags = (d.expertise || []).map(e => `<span class="tag">${esc(String(e).trim())}</span>`).join("");
  const cl = d.career || [];
  const career = cl.map((c,i) => `<div class="ti${i >= CAREER_VISIBLE ? " extra" : ""}"><small>${esc(c.y)}</small><div>${esc(c.t)}</div></div>`).join("");
  const careerMore = cl.length > CAREER_VISIBLE ? `<button class="more-btn" data-toggle="tl" type="button">Voir tout le parcours (${cl.length})${svg("chev")}</button>` : "";

  // --- Horaires
  const now = new Date(), today = (now.getDay()+6)%7, hr = now.getHours() + now.getMinutes()/60;
  const sched = DAYS.map(k => parseHours(d.hours && d.hours[k]));
  const td = sched[today], isOpen = td && hr >= td[0] && hr < td[1];
  const week = DAY_LABELS.map((n,i) => { const h = sched[i]; const a = h ? Math.max(h[0],7) : 0, b = h ? Math.min(h[1],21) : 0;
    return `<div class="wd ${i===today?"today":""}"><span class="dn">${n}</span><div class="track">${h?`<i style="left:${(a-7)/14*100}%;width:${Math.max(b-a,0.3)/14*100}%"></i>`:""}</div><span class="ht${h?"":" off"}">${h?`${fmtH(h[0])} – ${fmtH(h[1])}`:"Fermé"}</span></div>`; }).join("");

  // --- Contact, réseaux, à propos
  const contact = row("phone","Téléphone",d.phone,"tel:"+d.phone,fmtPhone(d.phone)) + row("chat","WhatsApp",d.whatsapp,"https://wa.me/"+digits(d.whatsapp),fmtPhone(d.whatsapp)) + row("mail","Email",d.email,"mailto:"+d.email) + row("pin","Adresse",d.address,dir);
  const soc = [["instagram","Instagram","instagram"],["facebook","Facebook","facebook"],["linkedin","LinkedIn","linkedin"],["website","Site personnel","globe"]].filter(([k]) => has(d[k])).map(([k,l,ic]) => `<a class="chip" href="${esc(d[k])}" target="_blank" rel="noopener">${svg(ic)}${l}</a>`).join("");
  const facts = [["Spécialité",d.specialty],["Expérience",d.experience],["Lieu d'exercice",d.clinic]].filter(([,v]) => has(v)).map(([l,v]) => `<div class="fact"><small>${l}</small>${esc(v)}</div>`).join("");
  const sec = (cond, html) => cond ? html : "";
  const longBio = has(d.bio) && String(d.bio).length > 320;

  document.getElementById("app").innerHTML = `
  <header class="hero fade">
    <div class="avatar-ring">${pic("avatar", full)}</div>
    ${sec(has(d.specialty), `<div class="badge-pro"><i></i>${esc(d.specialty)}</div>`)}
    <h1>${esc(full)}</h1>
    ${sec(has(d.subSpecialty), `<p class="sub">${esc(d.subSpecialty)}</p>`)}
    ${sec(has(d.clinic), `<div class="clinic">${svg("pin")}${esc(d.clinic)}</div>`)}
    <svg class="ecg" viewBox="0 0 400 44" preserveAspectRatio="none" aria-hidden="true"><path pathLength="100" d="M0 24 H110 l10-5 10 5 H160 l8-20 12 38 10-34 8 16 H250 l10-6 10 6 H400"/></svg>
  </header>
  <nav class="actions fade d1" id="actions">
    ${sec(tiles, `<div class="qa">${tiles}</div>`)}
    ${appt}
    <button class="btn ghost" id="save">${svg("user")}Ajouter aux contacts</button>
  </nav>
  ${sec(stats, `<section class="stats fade d2">${stats}</section>`)}

  <section class="card fade d2">${head("about","À propos")}
    ${sec(has(d.bio), `<div class="bio${longBio ? " clamp" : ""}" id="bio"><p>${esc(d.bio)}</p>${longBio ? `<button class="more-btn" data-toggle="bio" type="button">Lire la suite${svg("chev")}</button>` : ""}</div>`)}
    <div class="facts">${facts}</div>
  </section>

  ${sec(tags, `<section class="card">${head("star","Expertise")}<div class="tags">${tags}</div></section>`)}
  ${sec(career, `<section class="card">${head("path","Parcours")}<div class="tl" id="tl">${career}</div>${careerMore}</section>`)}
  ${sec(contact, `<section class="card fade d3">${head("phone","Contact")}${contact}</section>`)}

  ${sec(sched.some(Boolean), `<section class="card">${head("clock","Horaires")}
    <span class="pill ${isOpen?"on":""}">${isOpen?"Ouvert maintenant":"Actuellement fermé"}</span>
    ${week}<div class="axis"><span>7h</span><span>14h</span><span>21h</span></div>
  </section>`)}

  ${sec(has(dir), `<section class="card">${head("pin","Localisation")}
    <a class="map" href="${esc(dir)}" target="_blank" rel="noopener" aria-label="Ouvrir dans Google Maps"><div class="pin"></div></a>
    <div class="addr"><div>${sec(has(d.clinic), `<b>${esc(d.clinic)}</b>`)}${esc(d.address || "")}</div></div>
    <a class="btn" href="${esc(dir)}" target="_blank" rel="noopener">${svg("pin")}Voir l'itinéraire</a>
  </section>`)}

  ${sec(soc, `<section class="card">${head("link","Réseaux")}<div class="social">${soc}</div></section>`)}

  <section class="card qr">${head("share","Partager ce profil")}<div id="qr"></div><span>Scannez pour ouvrir la carte de ${esc(full)}</span></section>

  <footer><b>${esc(BRAND.name)}</b>${esc(BRAND.tagline)}
    ${sec(SETTINGS.showThemePicker, `<div class="demo"><div style="margin-top:12px">${Object.keys(THEMES).map(k => `<button class="dot" data-t="${k}" style="background:${THEMES[k].a}" aria-label="Thème ${k}"></button>`).join("")}</div></div>`)}
  </footer>
  ${sec(dockItems, `<div class="dock" id="dock">${dockItems}</div>`)}`;

  document.querySelectorAll(".dot").forEach(b => b.onclick = () => { const y = scrollY; themeOverride = b.dataset.t; render(d); scrollTo(0,y); });

  // « Lire la suite » / « Voir tout le parcours »
  document.querySelectorAll("[data-toggle]").forEach(b => b.onclick = () => {
    const t = document.getElementById(b.dataset.toggle), host = b.dataset.toggle === "bio" ? t : b.parentNode;
    const open = !host.classList.contains("open");
    host.classList.toggle("open", open);
    if (b.dataset.toggle === "bio") t.classList.toggle("clamp", !open); else t.classList.toggle("open", open);
    b.firstChild.textContent = b.dataset.toggle === "bio" ? (open ? "Réduire" : "Lire la suite") : (open ? "Réduire le parcours" : `Voir tout le parcours (${cl.length})`);
  });

  // Barre fixe : visible quand les boutons du haut ne sont plus à l'écran
  const dock = document.getElementById("dock"), act = document.getElementById("actions");
  if (dock && act && "IntersectionObserver" in window) {
    new IntersectionObserver(([e]) => dock.classList.toggle("show", !e.isIntersecting && e.boundingClientRect.top < 0)).observe(act);
  }

  // QR code → URL du profil (profileUrl), sinon URL de la page
  const box = document.getElementById("qr");
  try { new QRCode(box, { text: profileUrl(d), width: 150, height: 150, correctLevel: QRCode.CorrectLevel.M }); }
  catch(e){ box.textContent = "QR code"; }

  // Ajouter aux contacts (.vcf)
  document.getElementById("save").onclick = () => {
    const blob = new Blob([vcard(d, full)], { type: "text/vcard;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = `${d.firstName || "contact"}-${d.lastName || ""}.vcf`;
    document.body.appendChild(a); a.click(); a.remove();
  };
}

/* ---------- Routage : /dr-yassine  →  profil dont slug = "dr-yassine" ---------- */
// Photos : "photos/x.jpg" devient "/photos/x.jpg" (fonctionne depuis n'importe quelle URL)
const asset = p => /^(https?:|data:|\/)/i.test(String(p)) ? String(p) : "/" + String(p).replace(/^\.?\//, "");
// URL du profil (utilisée par le QR code) : automatique = domaine du site + "/" + slug
function profileUrl(d){
  if (has(d.profileUrl)) return d.profileUrl;
  const base = has(SETTINGS.siteUrl) ? String(SETTINGS.siteUrl).replace(/\/+$/, "") : location.origin;
  return base + "/" + d.slug;
}
function getSlug(){
  const q = new URLSearchParams(location.search).get("d");
  const h = (location.hash || "").replace(/^#\/?/, "");
  const seg = location.pathname.split("/").filter(x => x && !/\.html?$/i.test(x))[0];
  let v = q || h || seg || "";
  try { v = decodeURIComponent(v); } catch(e) {}
  return v.trim().toLowerCase();
}
function notFound(){
  const rs = document.documentElement.style, t = THEMES.or;
  TH = t; rs.setProperty("--h1",t.h1); rs.setProperty("--h2",t.h2); rs.setProperty("--gold",t.a); rs.setProperty("--al",t.al); rs.setProperty("--glow",t.a+"55");
  document.title = BRAND.name;
  const list = SETTINGS.showDirectory ? `<section class="card"><h2>Profils</h2><div class="social">${DOCTORS.map(x => `<a class="chip" href="/${esc(x.slug)}">${esc([x.title,x.firstName,x.lastName].filter(has).join(" "))}</a>`).join("")}</div></section>` : "";
  document.getElementById("app").innerHTML = `<header class="hero fade" style="padding-bottom:60px"><h1>${esc(BRAND.name)}</h1><p class="sub">${esc(BRAND.tagline)}</p><p class="sub">Profil introuvable. Vérifiez l'adresse ou scannez de nouveau la carte.</p></header>${list}`;
}
const _slug = getSlug();
const _doctor = DOCTORS.find(x => String(x.slug || "").trim().toLowerCase() === _slug);
_doctor ? render(_doctor) : notFound();
</script>
