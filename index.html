<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carte de visite numérique – Médecin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f8f6f2;--card:#fff;--ink:#16262d;--muted:#6f7d84;--line:#ebe5da;--brand:#12424a;--brand2:#0c2f36;--gold:#b08d57;--soft:#f3efe7;--wa:#2f8f5b;--h1:#1a5560;--h2:#0c2f36;--glow:rgba(176,141,87,.33);--al:#e0c898;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1a1e;--card:#132329;--ink:#eee9df;--muted:#93a4aa;--line:#233840;--soft:#182c33;--brand:#d9c08d;--brand2:#c9ad76}}
:root[data-theme="dark"]{--bg:#0d1a1e;--card:#132329;--ink:#eee9df;--muted:#93a4aa;--line:#233840;--soft:#182c33;--brand:#d9c08d;--brand2:#c9ad76}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased;font-weight:400}
.wrap{max-width:520px;margin:0 auto;padding:0 20px 44px;background:var(--bg)}
.hero{position:relative;margin:0 -20px;padding:60px 24px 44px;text-align:center;color:#f3ede0;border-radius:0 0 44px 44px;background:radial-gradient(120% 80% at 50% 0,var(--glow),transparent 60%),linear-gradient(170deg,var(--h1),var(--h2) 75%)}
.avatar{width:128px;height:128px;border-radius:50%;margin:0 auto 22px;object-fit:cover;display:block;border:3px solid var(--gold);box-shadow:0 0 0 7px var(--glow),0 14px 34px rgba(0,0,0,.28);background:var(--h2)}
h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:2.35rem;line-height:1.1;letter-spacing:.005em}
.spec{color:var(--al);font-weight:500;margin-top:10px;font-size:.78rem;letter-spacing:.24em;text-transform:uppercase}
.sub{color:var(--muted);font-size:.95rem;margin-top:6px}
.hero .sub{color:rgba(243,237,224,.72);margin-top:14px;font-weight:300}
.hero .sub:before{content:"";display:block;width:36px;height:1px;background:var(--gold);margin:0 auto 14px}
.actions{display:grid;gap:12px;margin:26px 0 8px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;padding:17px 18px;border-radius:16px;background:var(--card);color:var(--ink);text-decoration:none;font-weight:500;font-size:.95rem;border:1px solid var(--line);transition:transform .2s,box-shadow .2s;cursor:pointer;font-family:inherit;letter-spacing:.01em}
.btn:active,.tile:active{transform:scale(.98)}
.btn svg{width:20px;height:20px;stroke:var(--gold);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.btn.primary{background:linear-gradient(135deg,var(--h1),var(--h2));color:#f6efe0;border:0;box-shadow:0 12px 26px rgba(12,47,54,.28);padding:19px;font-size:1rem}
.btn.primary svg{stroke:var(--al)}
.btn.ghost{background:transparent;border-color:var(--gold);color:var(--ink)}
.trio{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:10px}
.tile{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 6px;border-radius:16px;background:var(--card);border:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:.82rem;font-weight:500;transition:transform .2s}
.tile svg{width:22px;height:22px;stroke:var(--gold);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:26px 24px;margin-top:18px}
h2{font-family:"Cormorant Garamond",Georgia,serif;font-size:1.55rem;font-weight:600;margin-bottom:18px;display:flex;align-items:center;gap:12px}
h2:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.about{display:flex;gap:14px;align-items:center;margin-bottom:14px}
.about img{width:54px;height:54px;border-radius:50%;object-fit:cover;border:1px solid var(--gold)}
.about b{font-family:"Cormorant Garamond",serif;font-size:1.2rem;font-weight:600}
.card p{color:var(--muted);font-weight:300;font-size:.97rem}
.facts{margin-top:18px}
.fact{display:flex;justify-content:space-between;gap:16px;align-items:baseline;padding:13px 0;border-top:1px solid var(--line);text-align:right;font-weight:500}
.fact small{color:var(--gold);font-size:.68rem;text-transform:uppercase;letter-spacing:.16em;text-align:left;flex:none}
.row{display:flex;gap:16px;align-items:center;padding:13px 0;border-top:1px solid var(--line);text-decoration:none;color:inherit}
.row:first-of-type{border-top:0}
.ico{flex:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--gold);display:grid;place-items:center}
.ico svg{width:18px;height:18px;stroke:var(--gold);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.row small{display:block;color:var(--muted);font-size:.68rem;text-transform:uppercase;letter-spacing:.14em}
.row span{font-weight:500;white-space:pre-line;overflow-wrap:anywhere}
.social{display:flex;flex-wrap:wrap;gap:10px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:999px;border:1px solid var(--line);background:var(--soft);color:var(--ink);text-decoration:none;font-weight:500;font-size:.88rem}
.chip svg{width:16px;height:16px;stroke:var(--gold);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.map{height:150px;border-radius:16px;margin-bottom:16px;position:relative;overflow:hidden;background:var(--soft);display:grid;place-items:center;border:1px solid var(--line)}
.map:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 30px,var(--line) 30px 31px),repeating-linear-gradient(90deg,transparent 0 40px,var(--line) 40px 41px)}
.map:after{content:"";position:absolute;width:140%;height:10px;background:var(--card);transform:rotate(-18deg);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.pin{position:relative;z-index:1;width:36px;height:36px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--gold);box-shadow:0 8px 16px rgba(176,141,87,.45);animation:b 2.4s ease-in-out infinite}
.pin:after{content:"";position:absolute;inset:11px;border-radius:50%;background:#fff}
@keyframes b{50%{transform:rotate(-45deg) translate(3px,-3px)}}
.qr{display:grid;place-items:center;gap:12px;text-align:center;color:var(--muted);font-size:.88rem}
.qr h2{width:100%}
#qr{padding:14px;background:#fff;border-radius:18px;border:1px solid var(--line);min-height:150px;min-width:150px;display:grid;place-items:center}
footer{text-align:center;margin-top:36px;color:var(--muted);font-size:.72rem;letter-spacing:.2em;text-transform:uppercase}
footer b{display:block;font-family:"Cormorant Garamond",serif;color:var(--ink);font-size:1.5rem;letter-spacing:.06em;text-transform:none;margin-bottom:2px}
.demo{margin-top:16px;font-size:.72rem;letter-spacing:.04em;text-transform:none}.demo a{color:var(--gold);margin:0 6px}
.fade{opacity:0;transform:translateY(12px);animation:f .7s ease forwards}
@keyframes f{to{opacity:1;transform:none}}
.d1{animation-delay:.1s}.d2{animation-delay:.2s}.d3{animation-delay:.3s}
@media (min-width:700px){body{padding:28px 0;background:linear-gradient(160deg,#e9e3d6,#d9e4e3)}.wrap{border-radius:40px;overflow:hidden;box-shadow:0 30px 70px rgba(12,47,54,.22)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;transform:none!important}}

.ecg{display:block;width:100%;height:44px;margin-top:26px}
.ecg path{fill:none;stroke:var(--al);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:100;animation:ecg 3.6s ease-in-out infinite}
@keyframes ecg{0%{stroke-dashoffset:100;opacity:1}60%{stroke-dashoffset:0;opacity:1}90%{stroke-dashoffset:0;opacity:0}100%{stroke-dashoffset:100;opacity:0}}
.tile i{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 14%,transparent)}
.tile svg{stroke:var(--c)}
.ico{border-color:var(--c,var(--gold));background:color-mix(in srgb,var(--c,var(--gold)) 12%,transparent)}
.ico svg{stroke:var(--c,var(--gold))}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px 6px 14px;text-align:center}
.rw{position:relative;width:76px;height:76px;margin:0 auto 8px}
.rw svg{width:100%;height:100%;transform:rotate(-90deg)}
.rw circle{fill:none;stroke-width:6}
.rw .bg{stroke:color-mix(in srgb,var(--c) 16%,transparent)}
.rw .fg{stroke:var(--c);stroke-linecap:round;stroke-dasharray:163.4;stroke-dashoffset:var(--off);animation:ring 1.4s ease-out}
@keyframes ring{from{stroke-dashoffset:163.4}}
.rw b{position:absolute;inset:0;display:grid;place-items:center;font-size:.86rem;font-weight:600;color:var(--c)}
.stat small{display:block;color:var(--muted);font-size:.74rem;line-height:1.3;padding:0 4px}
.tag{display:inline-block;padding:8px 14px;border-radius:999px;font-size:.84rem;font-weight:500;color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent);border:1px solid color-mix(in srgb,var(--c) 32%,transparent);margin:0 8px 8px 0}
.tl{position:relative;padding-left:28px}
.tl:before{content:"";position:absolute;left:6px;top:8px;bottom:14px;width:2px;background:linear-gradient(var(--gold),var(--line))}
.ti{position:relative;padding-bottom:18px}.ti:last-child{padding-bottom:0}
.ti:before{content:"";position:absolute;left:-28px;top:4px;width:14px;height:14px;border-radius:50%;background:var(--c);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 22%,transparent)}
.ti small{color:var(--c);font-weight:600;letter-spacing:.08em;font-size:.76rem;display:block}
.pill{display:inline-block;margin:-6px 0 14px;padding:5px 12px;border-radius:999px;font-size:.78rem;font-weight:500;background:color-mix(in srgb,#e04b4b 14%,transparent);color:#d04040}
.pill.on{background:color-mix(in srgb,#2faa63 16%,transparent);color:#238a4e}
.wd{display:grid;grid-template-columns:40px 1fr 76px;gap:10px;align-items:center;padding:6px 0;font-size:.85rem}
.dn{color:var(--muted)}.ht{text-align:right;font-weight:500}.today .dn{color:var(--gold);font-weight:700}
.track{height:10px;border-radius:6px;background:var(--soft);position:relative;overflow:hidden}
.track i{position:absolute;top:0;bottom:0;border-radius:6px;background:linear-gradient(90deg,var(--gold),var(--al))}
.today .track{box-shadow:0 0 0 1px var(--gold)}
.axis{display:flex;justify-content:space-between;margin:2px 76px 0 50px;font-size:.68rem;color:var(--muted)}
.dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--card);box-shadow:0 0 0 1px var(--line);margin:0 4px;cursor:pointer}
@media (prefers-reduced-motion:reduce){.ecg path{stroke-dashoffset:0!important;opacity:1!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="/config.js"></script>
<script>
/* ====================================================================
   🔒 MOTEUR MULTI-MÉDECINS — NE RIEN MODIFIER CI-DESSOUS
   (les données viennent de /config.js)
   ==================================================================== */
const THEMES = {
  or:       { h1:"#1a5560", h2:"#0c2f36", a:"#b08d57", al:"#e0c898" },
  ocean:    { h1:"#1f64a0", h2:"#0b2c4f", a:"#2f9fd8", al:"#bfe3f7" },
  emeraude: { h1:"#1c7059", h2:"#0b3a30", a:"#2fb58a", al:"#bdeedc" },
  royal:    { h1:"#5640a8", h2:"#241a52", a:"#8b6fe0", al:"#d9cffa" },
  rose:     { h1:"#a8426a", h2:"#4a1428", a:"#e0698d", al:"#fbd3df" }
};
const PAL = ["#2f7de1","#2faa63","#f0a030","#8b5cf6","#f0643c"];
let TH, themeOverride = null;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const digits = s => String(s ?? "").replace(/[^\d]/g, "");
const has = v => v !== undefined && v !== null && String(v).trim() !== "";
const I = {
  phone:'<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/>',
  chat:'<path d="M21 12a8 8 0 0 1-11.7 7L4 20l1.1-4.2A8 8 0 1 1 21 12z"/>',
  cal:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/>',
  pin:'<path d="M12 21s7-6.2 7-11.5a7 7 0 0 0-14 0C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>',
  mail:'<rect x="3" y="5" width="18" height="14" rx="3"/><path d="m3 7 9 6 9-6"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
  link:'<path d="M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/>'
};
const svg = k => `<svg viewBox="0 0 24 24" aria-hidden="true">${I[k]}</svg>`;
const DAYS = ["lun","mar","mer","jeu","ven","sam","dim"], DAY_LABELS = ["Lun","Mar","Mer","Jeu","Ven","Sam","Dim"];

function parseHours(str){
  const m = String(str || "").match(/^\s*(\d{1,2})(?:[:h](\d{2})?)?\s*[-–]\s*(\d{1,2})(?:[:h](\d{2})?)?\s*$/);
  return m ? [ +m[1] + (+m[2] || 0)/60, +m[3] + (+m[4] || 0)/60 ] : null;
}
const fmtH = x => { const h = Math.floor(x), mi = Math.round((x - h) * 60); return mi ? `${h}h${String(mi).padStart(2,"0")}` : `${h}h`; };

function fallbackAvatar(d){
  const ini = ((d.firstName || "?")[0] + (d.lastName || "")[0]).toUpperCase();
  const sv = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${TH.h1}"/><stop offset="1" stop-color="${TH.h2}"/></linearGradient></defs><rect width="120" height="120" fill="url(#g)"/><text x="60" y="73" font-family="Georgia,serif" font-size="44" fill="${TH.al}" text-anchor="middle">${ini}</text></svg>`;
  return "data:image/svg+xml;utf8," + encodeURIComponent(sv);
}

function vcard(d, full){
  const f = x => String(x || "").replace(/[\n,;]/g, " ");
  const L = ["BEGIN:VCARD","VERSION:3.0", `N:${f(d.lastName)};${f(d.firstName)};;${f(d.title)};`, `FN:${f(full)}`];
  if (has(d.specialty)) L.push(`TITLE:${f(d.specialty)}`);
  if (has(d.clinic))    L.push(`ORG:${f(d.clinic)}`);
  if (has(d.phone))     L.push(`TEL;TYPE=CELL:${d.phone}`);
  if (has(d.email))     L.push(`EMAIL;TYPE=WORK:${d.email}`);
  if (has(d.address))   L.push(`ADR;TYPE=WORK:;;${f(d.address)};;;;`);
  const url = has(d.website) ? d.website : d.profileUrl;
  if (has(url)) L.push(`URL:${url}`);
  L.push("END:VCARD");
  return L.join("\r\n");
}

function render(d){
  TH = THEMES[themeOverride || d.theme] || THEMES.or;
  const rs = document.documentElement.style;
  rs.setProperty("--h1",TH.h1); rs.setProperty("--h2",TH.h2); rs.setProperty("--gold",TH.a); rs.setProperty("--al",TH.al); rs.setProperty("--glow",TH.a+"55");

  const full = [d.title, d.firstName, d.lastName].filter(has).join(" ");
  const fb = fallbackAvatar(d), img = has(d.photo) ? asset(d.photo) : fb;
  const pic = (cls, alt) => `<img${cls ? ` class="${cls}"` : ""} src="${esc(img)}" data-fb="${esc(fb)}" onerror="this.onerror=null;this.src=this.dataset.fb" alt="${esc(alt)}">`;
  document.title = `${full} – ${d.specialty || ""}`;
  { let l = document.querySelector('link[rel="canonical"]'); if (!l) { l = document.createElement("link"); l.rel = "canonical"; document.head.appendChild(l); } l.href = profileUrl(d); }

  const dir = has(d.mapsUrl) ? d.mapsUrl : has(d.address) ? "https://www.google.com/maps/dir/?api=1&destination=" + encodeURIComponent(d.address) : "";
  const row = (ic, label, val, href, c) => !has(val) ? "" : `<${href?`a href="${esc(href)}"`:"div"} class="row" style="--c:${c}"><div class="ico">${svg(ic)}</div><div><small>${label}</small><span>${esc(val)}</span></div></${href?"a":"div"}>`;

  // --- Boutons d'action (chacun n'apparaît que si la donnée existe)
  const tiles = [
    has(d.phone)    && `<a class="tile" style="--c:#2f7de1" href="tel:${esc(d.phone)}"><i>${svg("phone")}</i>Appeler</a>`,
    has(d.whatsapp) && `<a class="tile" style="--c:#2faa63" href="https://wa.me/${digits(d.whatsapp)}" target="_blank" rel="noopener"><i>${svg("chat")}</i>WhatsApp</a>`,
    has(dir)        && `<a class="tile" style="--c:#f0643c" href="${esc(dir)}" target="_blank" rel="noopener"><i>${svg("pin")}</i>Itinéraire</a>`
  ].filter(Boolean).join("");
  const appt = has(d.appointmentUrl) ? `<a class="btn primary" href="${esc(d.appointmentUrl)}" target="_blank" rel="noopener">${svg("cal")}Prendre rendez-vous</a>` : "";

  // --- Chiffres clés, expertise, parcours
  const stats = (d.stats || []).map((x,i) => `<div class="stat" style="--c:${PAL[i%5]};--off:${(163.4*(1-(+x.p||0)/100)).toFixed(1)}"><div class="rw"><svg viewBox="0 0 64 64"><circle class="bg" cx="32" cy="32" r="26"/><circle class="fg" cx="32" cy="32" r="26"/></svg><b>${esc(x.v)}</b></div><small>${esc(x.l)}</small></div>`).join("");
  const tags = (d.expertise || []).map((e,i) => `<span class="tag" style="--c:${PAL[i%5]}">${esc(e)}</span>`).join("");
  const career = (d.career || []).map((c,i) => `<div class="ti" style="--c:${PAL[i%5]}"><small>${esc(c.y)}</small>${esc(c.t)}</div>`).join("");

  // --- Horaires
  const now = new Date(), today = (now.getDay()+6)%7, hr = now.getHours() + now.getMinutes()/60;
  const sched = DAYS.map(k => parseHours(d.hours && d.hours[k]));
  const td = sched[today], isOpen = td && hr >= td[0] && hr < td[1];
  const week = DAY_LABELS.map((n,i) => { const h = sched[i]; const a = h ? Math.max(h[0],7) : 0, b = h ? Math.min(h[1],21) : 0;
    return `<div class="wd ${i===today?"today":""}"><span class="dn">${n}</span><div class="track">${h?`<i style="left:${(a-7)/14*100}%;width:${Math.max(b-a,0.3)/14*100}%"></i>`:""}</div><span class="ht">${h?`${fmtH(h[0])} – ${fmtH(h[1])}`:"Fermé"}</span></div>`; }).join("");

  // --- Contact, réseaux, à propos
  const contact = row("phone","Téléphone",d.phone,"tel:"+d.phone,"#2f7de1") + row("chat","WhatsApp",d.whatsapp,"https://wa.me/"+digits(d.whatsapp),"#2faa63") + row("mail","Email",d.email,"mailto:"+d.email,"#8b5cf6") + row("pin","Adresse",d.address,"","#f0643c");
  const soc = [["instagram","Instagram"],["facebook","Facebook"],["linkedin","LinkedIn"],["website","Site personnel"]].filter(([k]) => has(d[k])).map(([k,l]) => `<a class="chip" href="${esc(d[k])}" target="_blank" rel="noopener">${svg("link")}${l}</a>`).join("");
  const facts = [["Spécialité",d.specialty],["Expérience",d.experience],["Lieu d'exercice",d.clinic]].filter(([,v]) => has(v)).map(([l,v]) => `<div class="fact"><small>${l}</small>${esc(v)}</div>`).join("");
  const sec = (cond, html) => cond ? html : "";

  document.getElementById("app").innerHTML = `
  <header class="hero fade">
    ${pic("avatar", full)}
    <h1>${esc(full)}</h1>
    <p class="spec">${esc(d.specialty)}</p>
    ${sec(has(d.subSpecialty), `<p class="sub">${esc(d.subSpecialty)}</p>`)}
    <svg class="ecg" viewBox="0 0 400 44" preserveAspectRatio="none" aria-hidden="true"><path pathLength="100" d="M0 24 H110 l10-5 10 5 H160 l8-20 12 38 10-34 8 16 H250 l10-6 10 6 H400"/></svg>
  </header>
  <nav class="actions fade d1">
    ${appt}
    ${sec(tiles, `<div class="trio">${tiles}</div>`)}
    <button class="btn ghost" id="save">${svg("user")}Ajouter aux contacts</button>
  </nav>
  ${sec(stats, `<section class="stats fade d2">${stats}</section>`)}

  <section class="card fade d2"><h2>À propos</h2>
    <div class="about">${pic("", "")}<div><b>${esc(full)}</b><div class="sub">${esc(d.specialty)}</div></div></div>
    ${sec(has(d.bio), `<p>${esc(d.bio)}</p>`)}
    <div class="facts">${facts}</div>
  </section>

  ${sec(tags, `<section class="card"><h2>Expertise</h2>${tags}</section>`)}
  ${sec(career, `<section class="card"><h2>Parcours</h2><div class="tl">${career}</div></section>`)}
  ${sec(contact, `<section class="card fade d3"><h2>Contact</h2>${contact}</section>`)}

  ${sec(sched.some(Boolean), `<section class="card"><h2>Horaires</h2>
    <span class="pill ${isOpen?"on":""}">${isOpen?"Ouvert maintenant":"Actuellement fermé"}</span>
    ${week}<div class="axis"><span>7h</span><span>14h</span><span>21h</span></div>
  </section>`)}

  ${sec(has(dir), `<section class="card"><h2>Localisation</h2>
    <div class="map" aria-hidden="true"><div class="pin"></div></div>
    <p class="sub" style="margin-bottom:14px">${esc([d.clinic, d.address].filter(has).join(" · "))}</p>
    <a class="btn" style="flex-direction:row;justify-content:center" href="${esc(dir)}" target="_blank" rel="noopener">${svg("pin")}Voir l'itinéraire</a>
  </section>`)}

  ${sec(soc, `<section class="card"><h2>Réseaux</h2><div class="social">${soc}</div></section>`)}

  <section class="card qr"><h2 style="margin:0">Partager ce profil</h2><div id="qr"></div><span>Scannez pour ouvrir la carte de ${esc(full)}</span></section>

  <footer><b>${esc(BRAND.name)}</b>${esc(BRAND.tagline)}
    ${sec(SETTINGS.showThemePicker, `<div class="demo"><div style="margin-top:12px">${Object.keys(THEMES).map(k => `<button class="dot" data-t="${k}" style="background:${THEMES[k].a}" aria-label="Thème ${k}"></button>`).join("")}</div></div>`)}
  </footer>`;

  document.querySelectorAll(".dot").forEach(b => b.onclick = () => { const y = scrollY; themeOverride = b.dataset.t; render(d); scrollTo(0,y); });

  // QR code → URL du profil (profileUrl), sinon URL de la page
  const box = document.getElementById("qr");
  try { new QRCode(box, { text: profileUrl(d), width: 150, height: 150, correctLevel: QRCode.CorrectLevel.M }); }
  catch(e){ box.textContent = "QR code"; }

  // Ajouter aux contacts (.vcf)
  document.getElementById("save").onclick = () => {
    const blob = new Blob([vcard(d, full)], { type: "text/vcard;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = `${d.firstName || "contact"}-${d.lastName || ""}.vcf`;
    document.body.appendChild(a); a.click(); a.remove();
  };
}

/* ---------- Routage : /dr-yassine  →  profil dont slug = "dr-yassine" ---------- */
// Photos : "photos/x.jpg" devient "/photos/x.jpg" (fonctionne depuis n'importe quelle URL)
const asset = p => /^(https?:|data:|\/)/i.test(String(p)) ? String(p) : "/" + String(p).replace(/^\.?\//, "");
// URL du profil (utilisée par le QR code) : automatique = domaine du site + "/" + slug
function profileUrl(d){
  if (has(d.profileUrl)) return d.profileUrl;
  const base = has(SETTINGS.siteUrl) ? String(SETTINGS.siteUrl).replace(/\/+$/, "") : location.origin;
  return base + "/" + d.slug;
}
function getSlug(){
  const q = new URLSearchParams(location.search).get("d");
  const h = (location.hash || "").replace(/^#\/?/, "");
  const seg = location.pathname.split("/").filter(x => x && !/\.html?$/i.test(x))[0];
  let v = q || h || seg || "";
  try { v = decodeURIComponent(v); } catch(e) {}
  return v.trim().toLowerCase();
}
function notFound(){
  const rs = document.documentElement.style, t = THEMES.or;
  TH = t; rs.setProperty("--h1",t.h1); rs.setProperty("--h2",t.h2); rs.setProperty("--gold",t.a); rs.setProperty("--al",t.al); rs.setProperty("--glow",t.a+"55");
  document.title = BRAND.name;
  const list = SETTINGS.showDirectory ? `<section class="card"><h2>Profils</h2><div class="social">${DOCTORS.map(x => `<a class="chip" href="/${esc(x.slug)}">${esc([x.title,x.firstName,x.lastName].filter(has).join(" "))}</a>`).join("")}</div></section>` : "";
  document.getElementById("app").innerHTML = `<header class="hero fade"><h1>${esc(BRAND.name)}</h1><p class="spec">${esc(BRAND.tagline)}</p><p class="sub">Profil introuvable. Vérifiez l'adresse ou scannez de nouveau la carte.</p></header>${list}`;
}
const _slug = getSlug();
const _doctor = DOCTORS.find(x => String(x.slug || "").trim().toLowerCase() === _slug);
_doctor ? render(_doctor) : notFound();
</script>
